<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img">
  <title>Logo VM escuro</title>
  <desc>Logo profissional com monograma VM sobre fundo escuro, com símbolos de código nas laterais</desc>
  <defs>
    <linearGradient id="bgd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1f26"/>
      <stop offset="1" stop-color="#0a0c10"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgd)"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="14.25" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <path d="M21 23 L13 32 L21 41" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/>
  <path d="M43 23 L51 32 L43 41" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/>

  <text x="32" y="39" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" letter-spacing="0.5" fill="#ffffff">VM</text>
</svg>
